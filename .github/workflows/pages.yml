# Builds the web version and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Optional: add EXPO_PUBLIC_ARENA_ADDRESS and EXPO_PUBLIC_BUILDER_ADDRESS under Settings -> Secrets and variables -> Actions -> Variables.
name: Deploy web build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_BUILDER_ADDRESS: ${{ vars.EXPO_PUBLIC_BUILDER_ADDRESS }}
          EXPO_PUBLIC_ARENA_ADDRESS: ${{ vars.EXPO_PUBLIC_ARENA_ADDRESS }}
          EXPO_PUBLIC_CHAIN_ID: ${{ vars.EXPO_PUBLIC_CHAIN_ID }}
          EXPO_PUBLIC_RPC_URL: ${{ vars.EXPO_PUBLIC_RPC_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
